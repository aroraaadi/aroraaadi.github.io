<title>Private</title>

<style>
:root { --bg:#f5f6f8; --card:#fff; --ink:#16181d; --muted:#5d6472; --line:#d9dde4; --accent:#1f4e79; --bad:#b42318; }
@media (prefers-color-scheme: dark) { :root { --bg:#0c0f14; --card:#151a22; --ink:#e7e9ee; --muted:#9aa3b2; --line:#2a3140; --accent:#7fb0e0; --bad:#f97066; } }
html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { min-height:100vh; display:grid; place-items:center; padding:16px; box-sizing:border-box; }
form { width:100%; max-width:340px; background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:28px 26px 22px; box-sizing:border-box; }
.mark { display:flex; gap:3px; margin-bottom:18px; } .mark i { width:9px; height:9px; border-radius:2px; background:var(--accent); }
.mark i:nth-child(2) { opacity:.7 } .mark i:nth-child(3) { opacity:.45 }
h1 { font-size:20px; margin:0 0 6px; font-weight:600; }
p { margin:0 0 18px; color:var(--muted); font-size:14px; line-height:1.45; }
label { display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
input { width:100%; box-sizing:border-box; font-size:16px; padding:10px 12px; border:1px solid var(--line); border-radius:7px;
  background:var(--bg); color:var(--ink); }
input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
button { margin-top:14px; width:100%; font-size:15px; font-weight:600; padding:10px; border:0; border-radius:7px;
  background:var(--accent); color:#fff; cursor:pointer; }
button[disabled] { opacity:.6; cursor:progress; }
#msg { min-height:18px; margin:12px 0 0; color:var(--bad); font-size:13px; }
</style></head>

<script>
(async () => {
  const SALT = "MpDPgfGoKmyjrpsN5V94AQ==", ITER = 600000;
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const enc = (u) => btoa(String.fromCharCode(...u));
  const blob = b64(document.getElementById("payload").textContent.trim());
  async function open(raw) {
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: blob.slice(4, 16) }, key, blob.slice(16)));
    sessionStorage.setItem("site-key", enc(raw));
    document.open(); document.write(html); document.close();
  }
  const attempt = async (raw) => { try { await open(raw); return true; } catch { return false; } };
  const saved = sessionStorage.getItem("site-key");
  if (saved && await attempt(b64(saved))) return;
  // A new tab borrows the key from any open, unlocked one.
  const lent = await new Promise((done) => {
    try {
      const ch = new BroadcastChannel("site-key");
      const t = setTimeout(() => { ch.close(); done(null); }, 400);
      ch.onmessage = (e) => { if (e.data && e.data.key) { clearTimeout(t); ch.close(); done(e.data.key); } };
      ch.postMessage({ ask: true });
    } catch { done(null); }
  });
  if (lent && await attempt(b64(lent))) return;
  sessionStorage.removeItem("site-key");
  const form = document.getElementById("gate"), pc = document.getElementById("pc"),
        msg = document.getElementById("msg"), go = document.getElementById("go");
  form.hidden = false; pc.focus();
  form.addEventListener("submit", async (e) => {
    e.preventDefault(); msg.textContent = ""; go.disabled = true; go.textContent = "Opening…";
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pc.value), "PBKDF2", false, ["deriveBits"]);
    const bits = new Uint8Array(await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" }, base, 256));
    if (!(await attempt(bits))) {
      go.disabled = false; go.textContent = "Open";
      msg.textContent = "That passcode did not open it."; pc.select();
    }
  });
})();
</script>
